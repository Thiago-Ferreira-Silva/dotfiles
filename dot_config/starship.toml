"$schema" = 'https://starship.rs/config-schema.json'

# ─────────────────────────────────────────────
# PROMPT
# ─────────────────────────────────────────────

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$sudo\
$status\
$character"""

add_newline = true

# ─────────────────────────────────────────────
# ARCH LINUX
# ─────────────────────────────────────────────

[os]
disabled = false
style = "bold"
format = "[$symbol]($style) "

[os.symbols]
Arch = "󰣇"

# ─────────────────────────────────────────────
# USUÁRIO
# ─────────────────────────────────────────────

[username]
show_always = true
style_user = "bold"
style_root = "bold red"
format = "[$user]($style)"

# ─────────────────────────────────────────────
# HOST
# ─────────────────────────────────────────────

[hostname]
ssh_only = true
style = "bold"
format = "[@$hostname]($style) "

# ─────────────────────────────────────────────
# DIRETÓRIO
# ─────────────────────────────────────────────

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[directory.substitutions]
"~" = "󰋜"
"Documents" = "󰈙"
"Downloads" = "󰇚"
"Pictures" = "󰉏"
"Projects" = "󰲋"
"Desktop" = "󰇄"

# ─────────────────────────────────────────────
# GIT
# ─────────────────────────────────────────────

[git_branch]
symbol = "󰘬 "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style))"

conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "󰹹 ⇡${ahead_count} ⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ─────────────────────────────────────────────
# PYTHON
# ─────────────────────────────────────────────

[python]
symbol = "󰌠 "
style = "bold yellow"
format = "[$symbol$virtualenv $version]($style) "
python_binary = ["python", "python3"]

# ─────────────────────────────────────────────
# NODE.JS
# ─────────────────────────────────────────────

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "[$symbol$version]($style) "

# ─────────────────────────────────────────────
# RUST
# ─────────────────────────────────────────────

[rust]
symbol = "󱘗 "
style = "bold red"
format = "[$symbol$version]($style) "

# ─────────────────────────────────────────────
# SUDO
# ─────────────────────────────────────────────

[sudo]
disabled = false
symbol = "󰒃 "
style = "bold red"
format = "[$symbol]($style)"

# ─────────────────────────────────────────────
# STATUS / ERRO
# ─────────────────────────────────────────────

[status]
disabled = false
symbol = "✘ "
style = "bold red"
format = "[$symbol$status]($style) "

success_symbol = ""

# ─────────────────────────────────────────────
# CARACTERE DO PROMPT
# ─────────────────────────────────────────────

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

